<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Codex Pantheon — How It Works</title>
  <desc id="desc">Diagram showing explicit Pantheon activation, parent Codex orchestration, seven specialist agents, task flow, effort levels, and core principles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b12"/><stop offset="1" stop-color="#11101b"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101722"/><stop offset="1" stop-color="#171323"/></linearGradient>
    <style>
      .title{font:700 38px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f3f4f6}.sub{font:500 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#b6a9cf}.h{font:700 19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#b78cff}.b{font:500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e4e7ec}.s{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#aeb5c2}.mono{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5ad7ff}.tag{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.box{fill:url(#panel);stroke:#5d497c;stroke-width:1.5}.blue{stroke:#2c8bd8}.purple{stroke:#7955a8}.orange{stroke:#c9782d}.green{stroke:#4d9b62}.cyan{stroke:#318b9d}.arrow{stroke:#a986d4;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a986d4"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="36" y="55" class="title">CODEX PANTHEON — HOW IT WORKS</text>
  <text x="36" y="88" class="sub">A slim, explicit, opt-in multi-agent layer that augments Codex.</text>
  <text x="36" y="125" class="b" fill="#ffffff"><tspan fill="#5ad7ff" font-weight="700">SOLO</tspan> BY DEFAULT. <tspan fill="#c18cff" font-weight="700">PANTHEON</tspan> ONLY WHEN YOU ASK.</text>

  <rect x="28" y="155" width="340" height="390" rx="18" class="box blue"/>
  <text x="52" y="190" class="h" fill="#65baff">1. ACTIVATION — EXPLICIT OPT-IN</text>
  <text x="52" y="222" class="b">Pantheon never starts on its own.</text>
  <text x="52" y="248" class="s">You explicitly invoke it:</text>
  <text x="72" y="290" class="mono">$pantheon</text><text x="72" y="313" class="s">full orchestration</text>
  <text x="72" y="352" class="mono">$pantheon-plan</text><text x="72" y="375" class="s">analysis &amp; planning</text>
  <text x="72" y="414" class="mono">$pantheon-review</text><text x="72" y="437" class="s">independent review</text>
  <text x="72" y="476" class="mono">$pantheon-team</text><text x="72" y="499" class="s">explicit broader fan-out</text>
  <text x="52" y="525" class="s">Or name a Pantheon agent directly.</text>

  <rect x="405" y="155" width="520" height="390" rx="18" class="box purple"/>
  <text x="430" y="190" class="h">2. PARENT CODEX — ALWAYS THE ORCHESTRATOR</text>
  <rect x="500" y="235" width="330" height="250" rx="18" fill="#211832" stroke="#845cb4" stroke-width="1.5"/>
  <text x="535" y="275" class="h">PARENT CODEX THREAD</text>
  <text x="535" y="315" class="b">• Understands the request</text>
  <text x="535" y="347" class="b">• Decomposes the task</text>
  <text x="535" y="379" class="b">• Selects the right agent(s)</text>
  <text x="535" y="411" class="b">• Delegates bounded work</text>
  <text x="535" y="443" class="b">• Integrates, validates, answers</text>
  <path d="M368 350 H500" class="arrow"/><text x="392" y="335" class="s">request</text>
  <path d="M830 350 H954" class="arrow"/><text x="842" y="335" class="s">bounded work</text>

  <rect x="962" y="155" width="610" height="390" rx="18" class="box purple"/>
  <text x="986" y="190" class="h">3. PANTHEON AGENTS — SPECIALIZED ROLES</text>
  <g transform="translate(985 215)">
    <rect width="560" height="42" rx="9" fill="#131823"/><text x="18" y="26" class="b">Explorer — repo/system mapping</text><text x="445" y="18" class="tag" fill="#57d7ff">LUNA</text><text x="445" y="34" class="tag" fill="#57d7ff">medium</text>
    <rect y="48" width="560" height="42" rx="9" fill="#131823"/><text x="18" y="74" class="b">Librarian — docs &amp; research</text><text x="445" y="66" class="tag" fill="#57d7ff">LUNA</text><text x="445" y="82" class="tag" fill="#57d7ff">medium</text>
    <rect y="96" width="560" height="42" rx="9" fill="#171722"/><text x="18" y="122" class="b">Oracle — architecture &amp; reasoning</text><text x="445" y="114" class="tag" fill="#ffaf58">SOL</text><text x="445" y="130" class="tag" fill="#ffaf58">high</text>
    <rect y="144" width="560" height="42" rx="9" fill="#131823"/><text x="18" y="170" class="b">Fixer — focused implementation</text><text x="445" y="162" class="tag" fill="#57d7ff">LUNA</text><text x="445" y="178" class="tag" fill="#57d7ff">max</text>
    <rect y="192" width="560" height="42" rx="9" fill="#171722"/><text x="18" y="218" class="b">Designer — UI/UX specialist</text><text x="445" y="210" class="tag" fill="#ffaf58">SOL</text><text x="445" y="226" class="tag" fill="#ffaf58">high</text>
    <rect y="240" width="560" height="42" rx="9" fill="#171722"/><text x="18" y="266" class="b">Reviewer — independent code review</text><text x="445" y="258" class="tag" fill="#ffaf58">SOL</text><text x="445" y="274" class="tag" fill="#ffaf58">high</text>
    <rect y="288" width="560" height="42" rx="9" fill="#132019"/><text x="18" y="314" class="b">Verifier — tests, builds, evidence</text><text x="445" y="306" class="tag" fill="#7bd989">TERRA</text><text x="445" y="322" class="tag" fill="#7bd989">medium</text>
  </g>

  <rect x="28" y="575" width="1544" height="190" rx="18" class="box"/>
  <text x="52" y="610" class="h" fill="#65baff">4. HOW A PANTHEON TASK FLOWS</text>
  <g transform="translate(48 635)">
    <rect width="190" height="95" rx="13" class="box blue"/><text x="18" y="30" class="h">INTENT</text><text x="18" y="58" class="s">You explicitly invoke</text><text x="18" y="79" class="s">Pantheon or an agent.</text>
    <path d="M195 47 H235" class="arrow"/>
    <rect x="240" width="190" height="95" rx="13" class="box purple"/><text x="258" y="30" class="h">DECOMPOSE</text><text x="258" y="58" class="s">Codex breaks the task</text><text x="258" y="79" class="s">into clear parts.</text>
    <path d="M435 47 H475" class="arrow"/>
    <rect x="480" width="190" height="95" rx="13" class="box"/><text x="498" y="30" class="h">SELECT</text><text x="498" y="58" class="s">Minimum useful</text><text x="498" y="79" class="s">specialists.</text>
    <path d="M675 47 H715" class="arrow"/>
    <rect x="720" width="190" height="95" rx="13" class="box blue"/><text x="738" y="30" class="h">DELEGATE</text><text x="738" y="58" class="s">Bounded scope, limits,</text><text x="738" y="79" class="s">expected evidence.</text>
    <path d="M915 47 H955" class="arrow"/>
    <rect x="960" width="190" height="95" rx="13" class="box cyan"/><text x="978" y="30" class="h">EXECUTE</text><text x="978" y="58" class="s">Agents work in their</text><text x="978" y="79" class="s">assigned lanes.</text>
    <path d="M1155 47 H1195" class="arrow"/>
    <rect x="1200" width="260" height="95" rx="13" class="box green"/><text x="1218" y="30" class="h" fill="#81da93">VERIFY &amp; ANSWER</text><text x="1218" y="58" class="s">Codex integrates results,</text><text x="1218" y="79" class="s">validates, and answers you.</text>
  </g>

  <rect x="28" y="790" width="500" height="170" rx="18" class="box blue"/>
  <text x="52" y="825" class="h" fill="#65baff">5. DIRECT INVOCATION</text>
  <text x="52" y="860" class="s">“Ask Oracle whether this architecture makes sense.”</text><text x="52" y="884" class="b">→ Oracle only</text>
  <text x="52" y="918" class="s">“Use Explorer and Librarian.”</text><text x="52" y="942" class="b">→ only those two</text>

  <rect x="550" y="790" width="470" height="170" rx="18" class="box orange"/>
  <text x="574" y="825" class="h" fill="#ffad5d">6. EFFORT LEVELS</text>
  <text x="574" y="862" class="b" fill="#65baff">FAST</text><text x="660" y="862" class="s">strongly minimize delegation</text>
  <text x="574" y="900" class="b" fill="#ffad5d">NORMAL</text><text x="660" y="900" class="s">balanced specialization + verification</text>
  <text x="574" y="938" class="b" fill="#7bd989">DEEP</text><text x="660" y="938" class="s">more research, still bounded</text>

  <rect x="1042" y="790" width="530" height="170" rx="18" class="box green"/>
  <text x="1066" y="825" class="h" fill="#81da93">7. KEY PRINCIPLES</text>
  <text x="1066" y="858" class="b">✓ Pantheon is opt-in.</text>
  <text x="1066" y="887" class="b">✓ Parent Codex is always in charge.</text>
  <text x="1066" y="916" class="b">✓ No child agent spawns subagents.</text>
  <text x="1066" y="945" class="b">✓ Enhance Codex. Don’t replace it.</text>
</svg>
