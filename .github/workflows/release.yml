name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release package
        shell: bash
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION_VALUE"
          test -f "docs/V${VERSION_VALUE}.md"
          grep -Fq "## ${VERSION_VALUE}" CHANGELOG.md
          ./tests/test.sh
          bash -n pantheon install.sh tests/test.sh

      - name: Publish tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION_VALUE}"
          NOTES="docs/V${VERSION_VALUE}.md"
          TITLE="$(sed -n '1s/^# //p' "$NOTES")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
            if [ "$EXISTING_SHA" = "$GITHUB_SHA" ]; then
              echo "Release ${TAG} already exists at ${GITHUB_SHA}; nothing to do."
              exit 0
            fi

            if git diff --quiet "${GITHUB_SHA}^" "$GITHUB_SHA" -- VERSION; then
              echo "Release ${TAG} already exists and VERSION did not change in this push; nothing to do."
              exit 0
            fi

            echo "Release ${TAG} already exists but does not point at ${GITHUB_SHA}." >&2
            exit 1
          fi

          TAG_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
          if [ -n "$TAG_SHA" ]; then
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Tag ${TAG} already exists at ${TAG_SHA}, not ${GITHUB_SHA}; refusing to overwrite it." >&2
              exit 1
            fi
            gh release create "$TAG" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file "$NOTES"
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$NOTES"
