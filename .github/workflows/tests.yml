name: Pantheon tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Linux lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Bash lifecycle suite
        run: ./tests/test.sh

  windows:
    name: Windows lifecycle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell lifecycle suite
        shell: pwsh
        run: .\tests\test.ps1
