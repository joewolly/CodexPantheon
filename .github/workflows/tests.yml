name: Pantheon tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Linux lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Bash lifecycle suite
        run: ./tests/test.sh
      - name: Verify Pantheon role ownership contracts
        run: bash ./tests/test-orchestrator-contract.sh
      - name: Verify public documentation contracts
        run: bash ./tests/test-doc-contract.sh
      - name: Verify live-smoke command contract
        run: bash ./tests/test-verify.sh

  macos:
    name: macOS Bash 3.2 compatibility
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report Bash version
        run: /bin/bash --version
      - name: Parse Pantheon with system Bash
        run: /bin/bash -n ./pantheon
      - name: Run Bash lifecycle suite with pinned system Bash
        env:
          PATH: /bin:/usr/bin:/usr/sbin:/sbin
        run: |
          test "$(command -v bash)" = "/bin/bash"
          /bin/bash ./tests/test.sh
      - name: Verify live-smoke command contract with pinned system Bash
        env:
          PATH: /bin:/usr/bin:/usr/sbin:/sbin
        run: |
          test "$(command -v bash)" = "/bin/bash"
          /bin/bash ./tests/test-verify.sh

  windows:
    name: Windows PowerShell 5.1 lifecycle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows PowerShell lifecycle suite
        shell: powershell
        run: .\tests\test.ps1
      - name: Verify Windows live-smoke command contract
        shell: powershell
        run: .\tests\test-verify.ps1
