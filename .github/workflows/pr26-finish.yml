name: Finish PR 26 review fixes

on:
  push:
    branches:
      - codex/harden-pantheon-verify-postmerge

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harden-pantheon-verify-postmerge
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old!r}")
              p.write_text(text.replace(old, new, count))

          # Bash verifier: remove timestamp correlation and reject ambiguous parent traces.
          replace(
              'pantheon',
              '  local output stderr_file last_message start_marker parent_reply parent_thread_id\n  local parent_trace="" child_trace="" spawn_lines spawn_line spawn_count call_id\n',
              '  local output stderr_file last_message parent_reply parent_thread_id\n  local parent_matches parent_match_count parent_trace="" child_trace="" spawn_lines spawn_line spawn_count call_id\n',
          )
          replace(
              'pantheon',
              '  start_marker="${VERIFY_TMP_DIR}/started"\n  : > "$start_marker"\n',
              '',
          )
          replace(
              'pantheon',
              '  parent_trace="$(find "$sessions_dir" -type f -name "*${parent_thread_id}.jsonl" -print -quit 2>/dev/null || true)"\n  [ -n "$parent_trace" ] || fail "Could not locate the parent rollout for thread ${parent_thread_id}."\n',
              '  parent_matches="$(find "$sessions_dir" -type f -name "*${parent_thread_id}.jsonl" -print 2>/dev/null || true)"\n  parent_match_count="$(printf \'%s\\n\' "$parent_matches" | grep -c . || true)"\n  [ "$parent_match_count" -eq 1 ] || fail "Expected exactly one parent rollout for thread ${parent_thread_id}; found ${parent_match_count}."\n  parent_trace="$parent_matches"\n',
          )
          replace(
              'pantheon',
              '  done < <(find "$sessions_dir" -type f -name \'*.jsonl\' -newer "$start_marker" -print 2>/dev/null)\n',
              '  done < <(find "$sessions_dir" -type f -name \'*.jsonl\' -print 2>/dev/null)\n',
          )

          # PowerShell verifier: provenance is sufficient; do not depend on filesystem mtime precision.
          replace('pantheon.ps1', '    $startedUtc = [DateTime]::UtcNow\n', '')
          replace(
              'pantheon.ps1',
              "        $recentFiles = @(Get-ChildItem -LiteralPath $sessionsDir -Recurse -File -Filter '*.jsonl' -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTimeUtc -ge $startedUtc })\n        foreach ($sessionFile in $recentFiles) {\n",
              "        $sessionFiles = @(Get-ChildItem -LiteralPath $sessionsDir -Recurse -File -Filter '*.jsonl' -ErrorAction SilentlyContinue)\n        foreach ($sessionFile in $sessionFiles) {\n",
          )

          # Doctrine: receipt reconciliation is an explicit stage before review/verification.
          replace(
              'docs/DESIGN_DOCTRINE.md',
              '→ receipt → Orchestrator review/verification',
              '→ receipt → reconcile receipt → Orchestrator review/verification',
              count=3,
          )

          # Public verifier contract: correlation is provenance-based, not timestamp-window-based.
          replace(
              'docs/CLI_REFERENCE.md',
              '- exactly one newly created child rollout whose `session_meta` records the matching parent, Luna Explorer role, and task path;',
              '- exactly one correlated child rollout whose `session_meta` records the matching parent, Luna Explorer role, and task path;',
          )
          replace(
              'docs/CLI_REFERENCE.md',
              "Prompt text or other raw substring co-occurrence is not accepted as proof. The verifier identifies the exact parent rollout by thread ID, correlates spawn/wait calls to their actual outputs, and limits child discovery to rollouts created or updated during the smoke test rather than content-scanning the user's entire session store.",
              "Prompt text or other raw substring co-occurrence is not accepted as proof. The verifier identifies the exact parent rollout by thread ID, correlates spawn/wait calls to their actual outputs, and identifies the child by the current parent thread ID plus Luna Explorer role/task-path provenance rather than filesystem timestamps or content-scanning the user's entire session store.",
          )
          replace(
              'CHANGELOG.md',
              '- Child rollout discovery is limited to the current smoke-test window instead of content-scanning the entire Codex session store.',
              '- Child rollout discovery is correlated by exact parent/role/path provenance rather than filesystem timestamps or content-scanning the entire Codex session store.',
          )

          # Bash verifier regression cases: ambiguous parent must fail; old child mtime must still pass.
          replace(
              'tests/test-verify.sh',
              'if [ "$mode" != "no-child" ]; then\n',
              'if [ "$mode" = "ambiguous-parent" ]; then\n  cp "$parent_file" "$session_dir/duplicate-${parent_id}.jsonl"\nfi\n\nif [ "$mode" != "no-child" ]; then\n',
          )
          replace(
              'tests/test-verify.sh',
              '  if [ "$mode" != "missing-task-complete" ]; then\n    printf \'{\"type\":\"event_msg\",\"payload\":{\"type\":\"task_complete\",\"last_agent_message\":\"%s\"}}\\n\' "$child_reply" >> "$child_file"\n  fi\nfi\n\nparent_reply=',
              '  if [ "$mode" != "missing-task-complete" ]; then\n    printf \'{\"type\":\"event_msg\",\"payload\":{\"type\":\"task_complete\",\"last_agent_message\":\"%s\"}}\\n\' "$child_reply" >> "$child_file"\n  fi\n  if [ "$mode" = "old-child-mtime" ]; then\n    touch -t 200001010000 "$child_file"\n  fi\nfi\n\nparent_reply=',
          )
          replace(
              'tests/test-verify.sh',
              'run_success() {\n  local out="$TMP/verify-success.out"\n  PANTHEON_VERIFY_FAKE_MODE=success "$PANTHEON" verify >"$out" 2>&1\n',
              'run_success() {\n  local mode="${1:-success}"\n  local out="$TMP/verify-success-${mode}.out"\n  PANTHEON_VERIFY_FAKE_MODE="$mode" "$PANTHEON" verify >"$out" 2>&1\n',
          )
          replace(
              'tests/test-verify.sh',
              'run_success\nfor mode in misleading-parent prompt-only missing-output multiple-spawn extra-spawn missing-wait timed-out-wait child-prompt-only missing-task-complete wrong-effort secret-leak no-child; do\n',
              'run_success success\nrun_success old-child-mtime\nfor mode in misleading-parent prompt-only missing-output multiple-spawn extra-spawn ambiguous-parent missing-wait timed-out-wait child-prompt-only missing-task-complete wrong-effort secret-leak no-child; do\n',
          )

          # Windows verifier regression cases mirror Bash.
          replace(
              'tests/test-verify.ps1',
              '        if (mode != "no-child")\n        {\n',
              '        if (mode == "ambiguous-parent")\n        {\n            File.Copy(parentFile, Path.Combine(sessionDir, "duplicate-" + parentId + ".jsonl"), true);\n        }\n\n        if (mode != "no-child")\n        {\n',
          )
          replace(
              'tests/test-verify.ps1',
              '                if (mode != "missing-task-complete")\n                {\n                    child.WriteLine("{\\\"type\\\":\\\"event_msg\\\",\\\"payload\\\":{\\\"type\\\":\\\"task_complete\\\",\\\"last_agent_message\\\":\\\"" + childReply + "\\\"}}");\n                }\n            }\n        }\n\n        var parentReply =',
              '                if (mode != "missing-task-complete")\n                {\n                    child.WriteLine("{\\\"type\\\":\\\"event_msg\\\",\\\"payload\\\":{\\\"type\\\":\\\"task_complete\\\",\\\"last_agent_message\\\":\\\"" + childReply + "\\\"}}");\n                }\n            }\n            if (mode == "old-child-mtime")\n            {\n                File.SetLastWriteTimeUtc(childFile, new DateTime(2000, 1, 1, 0, 0, 0, DateTimeKind.Utc));\n            }\n        }\n\n        var parentReply =',
          )
          replace(
              'tests/test-verify.ps1',
              "    foreach ($mode in @('misleading-parent', 'prompt-only', 'missing-output', 'multiple-spawn', 'extra-spawn', 'missing-wait', 'timed-out-wait', 'child-prompt-only', 'missing-task-complete', 'wrong-effort', 'secret-leak', 'no-child')) {\n",
              "    $oldMtime = Invoke-PantheonVerify 'old-child-mtime'\n    if ($oldMtime.ExitCode -ne 0 -or -not $oldMtime.Text.Contains('Status: VERIFIED')) { throw \"Pantheon verify failed with an old child mtime:`n$($oldMtime.Text)\" }\n\n    foreach ($mode in @('misleading-parent', 'prompt-only', 'missing-output', 'multiple-spawn', 'extra-spawn', 'ambiguous-parent', 'missing-wait', 'timed-out-wait', 'child-prompt-only', 'missing-task-complete', 'wrong-effort', 'secret-leak', 'no-child')) {\n",
          )

          # Documentation contract pins the corrected reconciliation/provenance language.
          replace(
              'tests/test-doc-contract.sh',
              'contains "$DOCTRINE" "Live verification is explicit and fail-closed"\n',
              'contains "$DOCTRINE" "Live verification is explicit and fail-closed"\ncontains "$DOCTRINE" "receipt → reconcile receipt → Orchestrator review/verification"\n',
          )
          replace(
              'tests/test-doc-contract.sh',
              'contains "$CLI" "Normal Codex parent/child session rollouts created by the real turn remain"\n',
              'contains "$CLI" "Normal Codex parent/child session rollouts created by the real turn remain"\ncontains "$CLI" "rather than filesystem timestamps"\n',
          )

          # Assert the risky timestamp-window implementation/documentation is gone.
          for path in ('pantheon', 'pantheon.ps1', 'docs/CLI_REFERENCE.md', 'CHANGELOG.md'):
              text = Path(path).read_text()
              for forbidden in ('-newer "$start_marker"', '$startedUtc', 'current smoke-test window', 'created or updated during the smoke test'):
                  if forbidden in text:
                      raise SystemExit(f"{path}: stale timestamp-window contract remains: {forbidden}")
          PY

      - name: Validate Bash and contracts
        shell: bash
        run: |
          ./tests/test.sh
          bash ./tests/test-orchestrator-contract.sh
          bash ./tests/test-doc-contract.sh
          bash ./tests/test-verify.sh
          bash -n pantheon install.sh tests/*.sh
          git diff --check

      - name: Commit verified fixes
        shell: bash
        run: |
          git rm .github/workflows/pr26-finish.yml
          git add pantheon pantheon.ps1 CHANGELOG.md docs/DESIGN_DOCTRINE.md docs/CLI_REFERENCE.md tests/test-verify.sh tests/test-verify.ps1 tests/test-doc-contract.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: finish Pantheon verifier hardening'
          git push origin HEAD:codex/harden-pantheon-verify-postmerge
