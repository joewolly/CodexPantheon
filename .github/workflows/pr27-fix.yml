name: Apply PR 27 macOS Bash fix

on:
  push:
    branches:
      - codex/fix-macos-bash32-bootstrap

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-macos-bash32-bootstrap
          fetch-depth: 0

      - name: Rewrite verifier prompt construction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pantheon')
          text = path.read_text()
          text = text.replace(
              '  local codex_bin explorer_config nonce secret prompt sessions_dir\n',
              '  local codex_bin explorer_config nonce secret prompt prompt_file sessions_dir\n',
              1,
          )

          old_start = '  prompt="$(cat <<EOF_VERIFY\n'
          old_end = 'EOF_VERIFY\n)"\n\n  VERIFY_TMP_DIR="$(mktemp -d "${TMPDIR:-/tmp}/pantheon-verify.XXXXXX")"\n  trap \'rm -rf -- "${VERIFY_TMP_DIR:-}"\' EXIT\n'
          start = text.find(old_start)
          if start == -1:
              raise SystemExit('could not find nested verifier heredoc start')
          end = text.find(old_end, start)
          if end == -1:
              raise SystemExit('could not find nested verifier heredoc end')
          body_start = start + len(old_start)
          body = text[body_start:end]
          replacement = (
              '  VERIFY_TMP_DIR="$(mktemp -d "${TMPDIR:-/tmp}/pantheon-verify.XXXXXX")"\n'
              '  trap \'rm -rf -- "${VERIFY_TMP_DIR:-}"\' EXIT\n'
              '  prompt_file="${VERIFY_TMP_DIR}/prompt.txt"\n'
              '  cat > "$prompt_file" <<EOF_VERIFY\n'
              + body +
              'EOF_VERIFY\n'
              '  prompt="$(cat "$prompt_file")"\n'
          )
          text = text[:start] + replacement + text[end + len(old_end):]
          path.write_text(text)
          PY

      - name: Validate modern Bash and repository contracts
        shell: bash
        run: |
          bash -n ./pantheon
          ./tests/test.sh
          bash ./tests/test-orchestrator-contract.sh
          bash ./tests/test-doc-contract.sh
          bash ./tests/test-verify.sh
          git diff --check

      - name: Commit hotfix
        shell: bash
        run: |
          git rm .github/workflows/pr27-fix.yml
          git add pantheon
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: support macOS Bash 3.2 verifier parsing'
          git push origin HEAD:codex/fix-macos-bash32-bootstrap
